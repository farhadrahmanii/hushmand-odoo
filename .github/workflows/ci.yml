name: CI

on:
  push:
  pull_request:

jobs:
  tier0:
    name: Tier 0 tests and Python/JavaScript parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tier 0 tests (no Odoo required)
        run: python tools/run_core_tests.py

      - name: Packaging tests (no Odoo required)
        # What these protect is a delivery, and a delivery fails at the
        # customer's site on the day they try to install it.
        run: python -m unittest discover -s tools/tests

      - name: Python and JavaScript must agree
        # Reports render in Python, forms render in JavaScript. If these two
        # drift, a printed document shows a different date from the screen it
        # came from -- a bug nobody notices until a customer does.
        run: python tools/verify_js_python_parity.py --from 1800 --to 2200

      - name: XML is well-formed and manifests are complete
        # Cheap checks that would otherwise only surface four minutes into the
        # Odoo job. A stray "--" inside an XML comment is illegal and has cost
        # a full CI cycle before.
        run: |
          python - <<'PY'
          import ast, pathlib, sys, xml.dom.minidom
          failures = []
          for f in pathlib.Path("addons").rglob("*.xml"):
              try:
                  xml.dom.minidom.parse(str(f))
              except Exception as exc:
                  failures.append("%s: %s" % (f, exc))
          for manifest in pathlib.Path("addons").glob("*/__manifest__.py"):
              src = manifest.read_text(encoding="utf-8")
              meta = ast.literal_eval(src[src.index("{"):src.rindex("}") + 1])
              module = manifest.parent
              # Both keys: a demo file named in the manifest but absent fails
              # the install just as hard as a missing data file, for every
              # customer who ticks "Load demonstration data". The demo job
              # installs with --with-demo and proves each one loads.
              for key in ("data", "demo"):
                  for entry in meta.get(key, []):
                      if not (module / entry).is_file():
                          failures.append("%s: missing %s file %s" % (module.name, key, entry))
              for bundle in meta.get("assets", {}).values():
                  for asset in bundle:
                      if "*" in asset:
                          continue
                      if not (pathlib.Path("addons") / asset).is_file():
                          failures.append("%s: missing asset %s" % (module.name, asset))
              # A declared banner that is not there shows a broken image at
              # the top of the page a customer is deciding from.
              for image in meta.get("images", []):
                  if not (module / image).is_file():
                      failures.append("%s: missing image %s" % (module.name, image))
          # Every module needs a tile in the Apps list, and any web_icon must
          # point at a file that exists -- a missing one breaks the app
          # switcher rather than just looking wrong.
          import re
          for module in sorted(pathlib.Path("addons").iterdir()):
              if not module.is_dir():
                  continue
              if not (module / "static/description/icon.png").is_file():
                  failures.append(
                      "%s: no static/description/icon.png "
                      "(run tools/generate_icons.py)" % module.name)
              if not (module / "static/description/banner.png").is_file():
                  failures.append(
                      "%s: no static/description/banner.png "
                      "(run tools/generate_icons.py)" % module.name)
              # Every module ships in a customer's zip on its own, so it has
              # to explain itself without the rest of the catalogue around it.
              if not (module / "README.md").is_file():
                  failures.append("%s: no README.md" % module.name)
          for f in pathlib.Path("addons").rglob("*.xml"):
              for m in re.finditer(r'web_icon="([^"]+)"', f.read_text(encoding="utf-8")):
                  spec = m.group(1)
                  if "," not in spec:
                      failures.append("%s: malformed web_icon %s" % (f, spec))
                      continue
                  mod, rel = spec.split(",", 1)
                  if not (pathlib.Path("addons") / mod / rel.strip()).is_file():
                      failures.append("%s: web_icon points at missing %s" % (f, spec))

          if failures:
              print("\n".join("::error::" + f for f in failures))
              sys.exit(1)
          print("XML, manifests and icons OK")
          PY

      - name: No JavaScript imports a library Odoo does not expose as a module
        # Odoo ships luxon and friends as plain scripts defining globals, not
        # as modules its loader can resolve. `import { DateTime } from "luxon"`
        # links to nothing -- and because our assets sit in web.assets_backend,
        # that failure was logged on every page of the web client while every
        # Python test still passed. Read the global the way Odoo's own code
        # does instead.
        run: |
          if grep -rnE 'from "[^@./]' addons/*/static/src/ 2>/dev/null; then
            echo "::error::bare import above: Odoo resolves @web/..., @odoo/... and relative paths only"
            exit 1
          fi
          echo "no unresolvable imports"


      - name: Every module has a current listing page
        # The listing page is the storefront. It is generated so that twenty
        # of them cannot drift into twenty different greens, and checked here
        # so that a hand-edit is not silently overwritten by the next build.
        run: python tools/build_listing.py --check

      - name: No AGPL dependency anywhere
        # An AGPL dependency would force these modules to AGPL too, letting any
        # customer redistribute paid software for free. See README.md.
        run: |
          if grep -rn "AGPL" addons/; then
            echo "::error::AGPL reference found in addons/ -- see the licensing rule in README.md"
            exit 1
          fi
          echo "clean"

  odoo:
    name: Install and test on Odoo 19
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    container:
      image: odoo:19
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install and run the module test suite
        # --test-tags restricts the run to our own modules. Without it Odoo
        # also runs its own ~991 base-module tests, which fail for
        # container-environment reasons that have nothing to do with us.
        run: |
          odoo -d ci \
            --db_host=postgres --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE/addons \
            -i af_jalali,af_l10n_base,af_dual_currency,af_hr,hm_approvals,hm_purchase_request,hm_account_reports,hm_assets,hm_expiry_docs,af_liaison,af_correspondence,hm_frontdesk,hm_roster,af_zakat,hm_contracts,hm_license,af_l10n_account,af_procurement,hm_payroll,af_hr_payroll,hm_timesheet \
            --test-enable --test-tags /af_jalali,/af_l10n_base,/af_dual_currency,/af_hr,/hm_approvals,/hm_purchase_request,/hm_account_reports,/hm_assets,/hm_expiry_docs,/af_liaison,/af_correspondence,/hm_frontdesk,/hm_roster,/af_zakat,/hm_contracts,/hm_license,/af_l10n_account,/af_procurement,/hm_payroll,/af_hr_payroll,/hm_timesheet \
            --stop-after-init --log-level=info 2>&1 | tee odoo.log
          # Odoo exits 0 even when tests fail, so inspect the log.
          if grep -qE "^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL)" odoo.log; then
            echo "::error::Odoo reported errors during install or tests"
            exit 1
          fi
          # This job installs WITHOUT demo data (Odoo 19 defaults with_demo to
          # False). Prove that: a customer who declines the samples must get a
          # database with none of them in it.
          if grep -qE "loading [a-z_]+/demo/" odoo.log; then
            echo "::error::Demo data loaded in the no-demo job"
            exit 1
          fi

      - name: Export the translation templates
        # Odoo 19 dropped --i18n-export for an "odoo i18n export" subcommand,
        # which writes addons/<module>/i18n/<module>.pot for every module named.
        # It can only read terms out of an installed module, so it runs here,
        # against the database the step above just built.
        run: |
          # Keep what is committed, to compare against afterwards. Templates
          # are named after their module, so a flat directory cannot collide.
          mkdir -p /tmp/pot-before
          cp addons/*/i18n/*.pot /tmp/pot-before/ 2>/dev/null || true
          cat > /tmp/odoo-i18n.conf <<EOF
          [options]
          db_host = postgres
          db_user = odoo
          db_password = odoo
          data_dir = /tmp/odoo-data
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE/addons
          EOF
          odoo i18n export -c /tmp/odoo-i18n.conf -d ci \
            af_jalali af_l10n_base af_dual_currency af_hr hm_approvals \
            hm_purchase_request hm_account_reports hm_assets hm_expiry_docs \
            af_liaison af_correspondence hm_frontdesk hm_roster af_zakat \
            hm_contracts hm_license af_l10n_account af_procurement \
            hm_payroll af_hr_payroll hm_timesheet
          python3 tools/normalise_pot.py
          echo "Exported:"
          wc -l addons/*/i18n/*.pot

      - name: The templates must match the source
        # A string added to a model and never re-exported is invisible: the
        # module works, CI is green, and the term simply cannot be translated
        # because no translator ever sees it. Compare instead of trusting.
        run: |
          mkdir -p /tmp/pot-after
          cp addons/*/i18n/*.pot /tmp/pot-after/
          if ! diff -ru /tmp/pot-before /tmp/pot-after; then
            echo "::error::Translatable strings changed without the templates being regenerated. Download the translation-templates artifact from this run and commit it."
            exit 1
          fi
          echo "Templates match the source"

      - name: The Dari translations must actually load
        # A .po Odoo cannot parse is skipped with one log line: the module
        # installs, the tests pass, and every screen stays English forever.
        # So this does not check that nothing went wrong. It activates the
        # language, exports Dari back OUT of the database, and counts what
        # came back.
        #
        # One export per module, never one export of all twenty: a combined
        # export lists each shared term only once, which makes every module
        # that inherits chatter look half-translated.
        run: |
          odoo i18n loadlang -c /tmp/odoo-i18n.conf -d ci -l fa_AF
          mkdir -p /tmp/loaded
          for module in addons/*/; do
            module=$(basename "$module")
            odoo i18n export -c /tmp/odoo-i18n.conf -d ci -l fa_AF \
              -o "/tmp/loaded/$module.po" "$module"
          done
          python3 tools/check_translations_loaded.py fa_AF /tmp/loaded

      - name: Upload the translation templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-templates
          path: addons/*/i18n/*.pot
          if-no-files-found: error

  demo:
    name: Install with demo data on Odoo 19
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    container:
      image: odoo:19
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install the catalogue with demo data
        # The other job proves the modules install clean. This one proves the
        # samples a customer sees when they tick "Load demonstration data"
        # actually install -- broken demo data breaks their very first login.
        #
        # Odoo 19 flipped this default: with_demo is False unless --with-demo
        # is passed (older versions loaded demo unless --without-demo was).
        # Without the flag these files are never exercised at all.
        #
        # Tests are deliberately not run here. They assert on record counts,
        # and demo records would change those counts for reasons that have
        # nothing to do with the code under test.
        run: |
          odoo -d demo --with-demo \
            --db_host=postgres --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE/addons \
            -i af_jalali,af_l10n_base,af_dual_currency,af_hr,hm_approvals,hm_purchase_request,hm_account_reports,hm_assets,hm_expiry_docs,af_liaison,af_correspondence,hm_frontdesk,hm_roster,af_zakat,hm_contracts,hm_license,af_l10n_account,af_procurement,hm_payroll,af_hr_payroll,hm_timesheet \
            --stop-after-init --log-level=info 2>&1 | tee demo.log
          if grep -qE "^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL)" demo.log; then
            echo "::error::Odoo reported errors while installing demo data"
            exit 1
          fi

      - name: Every declared demo file must actually have loaded
        # A silent no-op is the failure mode that hid here for a whole day:
        # the files existed, the manifests named them, CI was green, and not
        # one of them had ever been loaded.
        run: |
          python3 - <<'PY'
          import ast, pathlib, re, sys
          declared = set()
          for manifest in pathlib.Path("addons").glob("*/__manifest__.py"):
              src = manifest.read_text(encoding="utf-8")
              meta = ast.literal_eval(src[src.index("{"):src.rindex("}") + 1])
              for entry in meta.get("demo", []):
                  declared.add("%s/%s" % (manifest.parent.name, entry))
          log = pathlib.Path("demo.log").read_text(encoding="utf-8", errors="replace")
          loaded = set(re.findall(r"loading ([a-z0-9_]+/demo/[a-z0-9_]+\.xml)", log))
          missing = sorted(declared - loaded)
          if missing:
              for m in missing:
                  print("::error::declared as demo data but never loaded: %s" % m)
              sys.exit(1)
          print("all %d demo files loaded" % len(declared))
          PY

  screens:
    name: Every screen renders on Odoo 19
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    container:
      image: odoo:19
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Write the Odoo configuration
        run: |
          cat > /tmp/odoo.conf <<EOF
          [options]
          db_host = postgres
          db_user = odoo
          db_password = odoo
          data_dir = /tmp/odoo-data
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE/addons
          EOF

      - name: Install the catalogue with demo data
        # Demo data, because a screen photographed empty proves the view
        # renders but shows a customer nothing.
        run: |
          odoo -c /tmp/odoo.conf -d shots --with-demo \
            -i af_jalali,af_l10n_base,af_dual_currency,af_hr,hm_approvals,hm_purchase_request,hm_account_reports,hm_assets,hm_expiry_docs,af_liaison,af_correspondence,hm_frontdesk,hm_roster,af_zakat,hm_contracts,hm_license,af_l10n_account,af_procurement,hm_payroll,af_hr_payroll,hm_timesheet \
            --stop-after-init --log-level=warn

      - name: Install a browser
        run: |
          pip install --break-system-packages playwright
          playwright install --with-deps chromium

      - name: Start Odoo
        run: |
          odoo -c /tmp/odoo.conf -d shots --http-port=8069 --log-level=warn \
            > /tmp/odoo-server.log 2>&1 &
          echo $! > /tmp/odoo.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8069/web/health > /dev/null; then
              echo "Odoo answered after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Odoo never became healthy"
          tail -50 /tmp/odoo-server.log
          exit 1

      - name: Every screen renders, and is photographed
        run: python3 tools/take_screenshots.py --out screenshots/en

      - name: Switch to Dari and photograph it again
        # The translation is only useful if it renders. This activates fa_AF,
        # puts the admin into it, and drives the same twenty screens right to
        # left -- asserting that the direction really flipped and the menus
        # really are in Dari, because a language that fails to activate
        # produces twenty good English screenshots in a folder named fa_AF.
        run: |
          kill $(cat /tmp/odoo.pid) 2>/dev/null || true
          sleep 3
          odoo i18n loadlang -c /tmp/odoo.conf -d shots -l fa_AF
          odoo shell -c /tmp/odoo.conf -d shots --log-level=warn <<'PYSHELL'
          env['res.users'].browse(2).write({'lang': 'fa_AF'})
          env.cr.commit()
          print('ADMIN LANG IS NOW:', env['res.users'].browse(2).lang)
          print('ACTIVE LANGS:', env['res.lang'].search([]).mapped('code'))
          PYSHELL
          odoo -c /tmp/odoo.conf -d shots --http-port=8069 --log-level=warn             > /tmp/odoo-dari.log 2>&1 &
          echo $! > /tmp/odoo.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8069/web/health > /dev/null && break
            sleep 1
          done
          python3 tools/take_screenshots.py --out screenshots/fa_AF             --lang fa_AF --expect-rtl

      - name: Odoo logged nothing while the screens were open
        # A screen can render and still have thrown server-side. The browser
        # would not necessarily show it; the log always does.
        run: |
          cp /tmp/odoo-server.log screenshots/odoo-server.log || true
          cp /tmp/odoo-dari.log screenshots/odoo-dari.log || true
          python3 tools/check_server_log.py /tmp/odoo-server.log
          python3 tools/check_server_log.py /tmp/odoo-dari.log

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          # warn, not error: when the run fails before the first shutter the
          # real cause is the step above, and a second red X here only buries
          # it.
          if-no-files-found: warn
